[package]
name = "toymachine"
version = "0.1.0"
edition = "2024"
description = "Toy payments engine: streams CSV transactions through async actors and reports client balances"

[dependencies]
anyhow = "1"
async-stream = "0.3.6"
csv = "1.3"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
tokio-stream = "0.1"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
